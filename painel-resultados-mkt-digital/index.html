<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------
     MADE TOMMY (Black) — fonte de marca para títulos.
     Assim que você me enviar os arquivos (idealmente .woff2), eu coloco
     em /fonts e essa declaração passa a valer. Até lá, o fallback abaixo
     (Poppins 900) mantém o peso e o estilo geométrico/redondo aproximado.
     --------------------------------------------------------------------- */
  @font-face{
    font-family:'MADE TOMMY';
    src: url('fonts/MadeTommy-Black.woff2') format('woff2'),
         url('fonts/MadeTommy-Black.woff') format('woff'),
         url('fonts/MadeTommy-Black.otf') format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --ink:#1A1512;
    --paper:#F7F5F1;
    --paper-raise:#EFEBE3;
    --red:#E30613;
    --red-deep:#A80410;
    --yellow:#FDC300;
    --beige:#F1E7D2;
    --brick:#A80410;
    --line: rgba(26,21,18,0.14);
    --radius-card: 3px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'MADE TOMMY', 'Poppins', sans-serif;
    font-weight:900;
    margin:0;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- HERO ---------- */
  .hero{
    background: var(--beige);
    color:var(--ink);
    padding:48px 32px 40px;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid rgba(26,21,18,0.1);
  }
  .hero::before{
    content:"";
    position:absolute;
    right:-60px; top:-80px;
    width:280px; height:280px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(227,6,19,0.14), rgba(227,6,19,0) 70%);
  }
  .hero-inner{
    max-width:1080px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .logo-chip{
    background:#fff;
    padding:8px 16px;
    border-radius:4px;
    display:inline-flex;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .brand-row img{
    height:52px;
    width:auto;
    display:block;
  }
  .hero h1{
    font-family:'MADE TOMMY', 'Poppins', sans-serif;
    font-weight:900;
    font-size:clamp(34px, 5vw, 54px);
    line-height:1.05;
    max-width:640px;
    color:var(--ink);
  }
  .hero p{
    max-width:520px;
    margin-top:16px;
    font-size:16px;
    line-height:1.55;
    color:rgba(26,21,18,0.7);
  }

  /* ---------- SEARCH + NAV ---------- */
  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 32px;
  }
  .toolbar-inner{
    max-width:1080px;
    margin:0 auto;
    display:flex;
    gap:18px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-box{
    flex:1;
    min-width:200px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    padding:9px 12px;
  }
  .search-box input{
    border:none;
    outline:none;
    background:none;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    width:100%;
    color:var(--ink);
  }
  .search-box svg{ flex-shrink:0; opacity:0.55; }
  .nav-pills{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .nav-pills::-webkit-scrollbar{display:none;}
  .nav-pills a{
    white-space:nowrap;
    font-size:13px;
    padding:8px 13px;
    border:1px solid var(--line);
    border-radius:2px;
    color: var(--red-deep);
    background:#fff;
    transition: background 0.15s, color 0.15s;
  }
  .nav-pills a:hover{
    background:var(--red);
    color:#fff;
    border-color:var(--red);
  }

  /* ---------- SECTIONS ---------- */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:8px 32px 80px;
  }
  section.category{
    padding-top:52px;
    scroll-margin-top:90px;
  }
  .category-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .category-index{
    font-family:'MADE TOMMY', 'Poppins', sans-serif;
    font-weight:900;
    font-size:14px;
    color: var(--red-deep);
    flex-shrink:0;
  }
  .category-head h2{
    font-size:23px;
    color: var(--ink);
  }
  .category-desc{
    margin:0 0 22px;
    font-size:14px;
    color:rgba(26,21,18,0.62);
    max-width:560px;
    line-height:1.5;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
  }
  @media (max-width:640px){
    .card-grid{grid-template-columns:1fr;}
    .hero{padding:44px 20px 32px;}
    main{padding:8px 20px 60px;}
    .toolbar{padding:12px 20px;}
  }

  .card{
    display:block;
    background:#fff;
    border:1px solid var(--line);
    border-left:3px solid var(--yellow);
    border-radius:var(--radius-card);
    padding:18px 18px 16px;
    position:relative;
    transition: border-left-color 0.15s, transform 0.15s;
  }
  .card:hover{
    border-left-color: var(--red);
    transform: translateX(2px);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card h3{
    font-size:17px;
    color:var(--ink);
    line-height:1.3;
  }
  .card .chev{
    flex-shrink:0;
    opacity:0.35;
    transition: opacity 0.15s, transform 0.15s;
  }
  .card:hover .chev{
    opacity:0.9;
    transform: translate(2px,-2px);
  }
  .card p{
    margin:8px 0 0;
    font-size:13.5px;
    line-height:1.5;
    color:rgba(26,21,18,0.6);
  }
  .card .missing-tag{
    display:inline-block;
    margin-top:10px;
    font-size:11px;
    background: rgba(156,74,46,0.1);
    color: var(--brick);
    padding:3px 7px;
    border-radius:2px;
  }

  /* ---- card with month sub-links (dropdown) ---- */
  .card-group{
    position:relative;
  }
  .card-group .card{
    cursor:pointer;
  }
  .card-group .card:focus{
    outline:2px solid var(--red);
    outline-offset:2px;
  }
  .month-menu{
    display:none;
    position:absolute;
    left:0;
    top:calc(100% + 6px);
    z-index:20;
    min-width:180px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 6px 18px rgba(0,0,0,0.14);
    padding:6px;
  }
  .card-group.open .month-menu{
    display:block;
  }
  .month-menu a{
    display:block;
    padding:9px 12px;
    font-size:13.5px;
    color:var(--ink);
    border-radius:3px;
    transition: background 0.12s;
  }
  .month-menu a:hover{
    background: var(--paper);
    color: var(--red-deep);
  }

  .empty-state{
    display:none;
    padding:40px 0;
    text-align:center;
    color:rgba(26,21,18,0.5);
    font-size:14px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:26px 32px 40px;
    text-align:center;
    font-size:12.5px;
    color:rgba(26,21,18,0.45);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">

const main = document.getElementById('main');
const navPills = document.getElementById('navPills');

function slug(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function chevSVG(){
  return '<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>';
}

DASHBOARDS.forEach((cat, i) => {
  const id = slug(cat.category);

  const pill = document.createElement('a');
  pill.href = '#' + id;
  pill.textContent = cat.category;
  navPills.appendChild(pill);

  const section = document.createElement('section');
  section.className = 'category';
  section.id = id;

  const num = String(i + 1).padStart(2, '0');
  section.innerHTML = `
    <div class="category-head">
      <span class="category-index">${num}</span>
      <h2>${cat.category}</h2>
    </div>
    <p class="category-desc">${cat.description}</p>
    <div class="card-grid"></div>
  `;

  const grid = section.querySelector('.card-grid');
  cat.items.forEach(item => {
    if (item.links && item.links.length){
      // card with a dropdown of month links
      const wrap = document.createElement('div');
      wrap.className = 'card-group';
      wrap.dataset.name = item.name.toLowerCase();

      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="card-top">
          <h3>${item.name}</h3>
          ${chevSVG()}
        </div>
        <p>${item.desc}</p>
      `;

      const menu = document.createElement('div');
      menu.className = 'month-menu';
      item.links.forEach(l => {
        const a = document.createElement('a');
        a.href = l.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = l.label;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          window.open(l.url, '_blank', 'noopener,noreferrer');
        });
        menu.appendChild(a);
      });

      function toggle(e){
        e.stopPropagation();
        const isOpen = wrap.classList.contains('open');
        document.querySelectorAll('.card-group.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) wrap.classList.add('open');
      }
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); } });

      wrap.appendChild(card);
      wrap.appendChild(menu);
      grid.appendChild(wrap);
      return;
    }

    const hasUrl = item.url && item.url.trim().length > 0;
    const card = document.createElement('a');
    card.className = 'card';
    card.href = hasUrl ? item.url : '#';
    card.target = hasUrl ? '_blank' : '_self';
    card.rel = 'noopener noreferrer';
    card.dataset.name = item.name.toLowerCase();
    card.innerHTML = `
      <div class="card-top">
        <h3>${item.name}</h3>
        ${chevSVG()}
      </div>
      <p>${item.desc}</p>
      ${hasUrl ? '' : '<span class="missing-tag">em construção</span>'}
    `;
    if (hasUrl){
      card.addEventListener('click', (e) => {
        e.preventDefault();
        window.open(item.url, '_blank', 'noopener,noreferrer');
      });
    } else {
      card.addEventListener('click', e => e.preventDefault());
    }
    grid.appendChild(card);
  });

  main.appendChild(section);
});

document.addEventListener('click', () => {
  document.querySelectorAll('.card-group.open').forEach(el => el.classList.remove('open'));
});

const emptyState = document.createElement('div');
emptyState.className = 'empty-state';
emptyState.textContent = 'Nenhum dashboard encontrado.';
main.appendChild(emptyState);

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('section.category').forEach(sec => {
    let sectionHasVisible = false;
    sec.querySelectorAll('.card-grid > .card, .card-grid > .card-group').forEach(el => {
      const match = el.dataset.name.includes(q);
      el.style.display = match ? '' : 'none';
      if (match) sectionHasVisible = true;
    });
    sec.style.display = sectionHasVisible ? '' : 'none';
    if (sectionHasVisible) anyVisible = true;
  });
  emptyState.style.display = anyVisible ? 'none' : 'block';
});
