<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minas Cap · Mapeamento de cidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111827; --slate:#1F2937; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --line2:#F1F2F4; --paper:#FFFFFF; --bg:#F7F8F9; --band:#FBFBFC;
  --red:#C8191A; --gold:#C8901E;
  --fica-bg:#E8F3EC; --fica-tx:#166534;
  --sai-bg:#FCE9E7;  --sai-tx:#991B1B;
  --entra-bg:#E8EEF9;--entra-tx:#1E3A8A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);
     font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}

/* topo */
header{background:var(--paper);border-bottom:1px solid var(--line)}
.brandbar{height:4px;background:linear-gradient(90deg,var(--red) 0%,var(--gold) 65%,var(--red) 100%)}
.head{padding:26px 0 20px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.meta-strip{display:flex;flex-wrap:wrap;gap:0 26px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--faint)}
.meta-strip b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}

/* abas */
nav{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;
     border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--red);border-bottom-color:var(--red)}

main{padding:26px 0 60px}
.panel{display:none}.panel.on{display:block}
.sec{margin-bottom:30px}
.sec-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}

/* cartões */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:26px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.card .lb{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.card .vl{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.card .ft{font-size:11.5px;color:var(--muted);margin-top:5px}
.card.hl{background:#FFFBEB;border-color:#FDE68A}
.card.hl .vl{color:#92400E}
.card.hl .lb{color:#B45309}

/* tabelas */
.tbl-wrap{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
         padding:12px 15px;border-bottom:1px solid var(--line)}
.tbl-title{font-size:13.5px;font-weight:700}
.tbl-title span{color:var(--faint);font-weight:500;margin-left:6px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.search{border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12.5px;
        font-family:inherit;width:190px;color:var(--ink);background:var(--bg)}
.search:focus{outline:none;border-color:var(--slate);background:var(--paper)}
.chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
      background:var(--paper);color:var(--muted);cursor:pointer;font-family:inherit}
.chip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.scroll{overflow-x:auto;max-height:620px;overflow-y:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
th{position:sticky;top:0;z-index:10;background:var(--slate);color:#fff;font-size:10px;font-weight:700;
   letter-spacing:.06em;text-transform:uppercase;padding:10px 11px;text-align:right;
   white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,th.l{text-align:left}
th:hover{background:#374151}
th .ar{opacity:.35;font-size:9px;margin-left:3px}
th.sorted .ar{opacity:1}
td{padding:8px 11px;text-align:right;font-size:13px;border-bottom:1px solid var(--line2);white-space:nowrap}
td:first-child,td.l{text-align:left}
tbody tr:nth-child(even){background:var(--band)}
tbody tr:hover{background:#F0F4F8}
td.city{font-weight:600}
td.dim{color:var(--muted);font-size:12.5px}
td.num{font-weight:600}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.p-fica{background:var(--fica-bg);color:var(--fica-tx)}
.p-sai{background:var(--sai-bg);color:var(--sai-tx)}
.p-entra{background:var(--entra-bg);color:var(--entra-tx)}
tfoot td{background:var(--paper);border-top:2px solid var(--slate);border-bottom:none;
         font-weight:700;font-size:13px;position:sticky;bottom:0}
.rank{color:var(--faint);font-weight:700;font-size:12px;width:34px}

/* barra de proporção */
.bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:54px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--slate);border-radius:3px}

/* notas */
.notes{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--slate);
       border-radius:0 10px 10px 0;padding:14px 17px;margin-top:16px}
.notes h4{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.notes li{font-size:12px;color:var(--muted);line-height:1.65;list-style:none;padding-left:14px;position:relative;margin-bottom:3px}
.notes li::before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.notes li b{color:var(--ink);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--faint);font-size:13px}

@media(max-width:640px){
  .wrap{padding:0 14px} h1{font-size:22px} .card .vl{font-size:21px}
  .search{width:130px} .scroll{max-height:none}
}
@media print{
  nav,.tools,.brandbar{display:none} .panel{display:block!important;page-break-before:always}
  .scroll{max-height:none;overflow:visible} body{background:#fff}
}
</style>
</head>

const nf=n=>n?n.toLocaleString('pt-BR'):'–';
const mf=n=>n?'R$ '+Math.round(n).toLocaleString('pt-BR'):'–';
const m2=n=>n?'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'–';
const d1=n=>n?n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}):'–';
const pc=n=>(n*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const pill=s=>s==='MANTÉM'?'<span class="pill p-fica">Fica</span>':s==='SAI'?'<span class="pill p-sai">Sai</span>':'<span class="pill p-entra">Entra</span>';
const tk=(e,v)=>v?e/v:0, per=(v,p)=>p?v/p*1000:0;

/* ---------- RESUMO ---------- */
function resumo(){

  const linhas=DATA.status.map(x=>{const q=a[x.s];return `<tr>

  const cls=Object.entries(DATA.clusters).map(([k,q])=>`<tr>

      </tfoot></table></div></div>
  </div>
  <div class="sec"><div class="sec-h">Clusters de mídia · lista final</div>

      <tbody>${cls}</tbody></table></div></div>
  </div>
  <div class="sec"><div class="sec-h">Top 12 contra a cauda</div>

      <tbody>
        <tr><td class="l city">Top 12</td><td class="num">12</td><td>${nf(g.top.p)}</td><td class="num">${nf(g.top.v)}</td><td>${mf(g.top.e)}</td><td>${pc(g.top.v/f.v)}</td><td>${d1(per(g.top.v,g.top.p))}</td><td>${m2(tk(g.top.e,g.top.v))}</td></tr>
        <tr><td class="l city">Fora do Top 12</td><td class="num">104</td><td>${nf(g.resto.p)}</td><td class="num">${nf(g.resto.v)}</td><td>${mf(g.resto.e)}</td><td>${pc(g.resto.v/f.v)}</td><td>${d1(per(g.resto.v,g.resto.p))}</td><td>${m2(tk(g.resto.e,g.resto.v))}</td></tr>

    <div class="notes"><h4>O que isso significa</h4><ul>

/* ---------- TABELAS ---------- */
const COLS={
 mapa:[{h:'Cidade',k:'c',t:'t'},{h:'Meta',k:'s',t:'p'},{h:'Cluster de mídia',k:'k',t:'t'},
   {h:'Região',k:'r',t:'t'},{h:'População',k:'p',t:'n'},{h:'Vendas',k:'v',t:'n'},
   {h:'Receita',k:'e',t:'m'},{h:'Ticket médio',k:'_tk',t:'m2'},{h:'Vendas por mil hab.',k:'_pr',t:'d'},
   {h:'Vendas via Meta',k:'m',t:'n'},{h:'% via Meta',k:'_pm',t:'pc2'}],
 top:[{h:'#',k:'_i',t:'r'},{h:'Cidade',k:'c',t:'t'},{h:'Meta',k:'s',t:'p'},{h:'Cluster de mídia',k:'k',t:'t'},
   {h:'População',k:'p',t:'n'},{h:'Vendas',k:'v',t:'n'},{h:'Receita',k:'e',t:'m'},
   {h:'Ticket médio',k:'_tk',t:'m2'},{h:'Vendas por mil hab.',k:'_pr',t:'d'},
   {h:'% do total',k:'_ps',t:'pc'},{h:'% acumulado',k:'_ac',t:'pc'}],
 resto:[{h:'#',k:'_i',t:'r'},{h:'Cidade',k:'c',t:'t'},{h:'Meta',k:'s',t:'p'},{h:'Cluster de mídia',k:'k',t:'t'},
   {h:'Região',k:'r',t:'t'},{h:'População',k:'p',t:'n'},{h:'Vendas',k:'v',t:'n'},
   {h:'Receita',k:'e',t:'m'},{h:'Ticket médio',k:'_tk',t:'m2'},
   {h:'Vendas por mil hab.',k:'_pr',t:'d'},{h:'% do total',k:'_ps',t:'pc2'}]
};
function prep(arr,cum){let a=0;return arr.map((x,i)=>{const o={...x};o._i=i+1;o._tk=tk(x.e,x.v);
  o._pr=per(x.v,x.p);o._ps=x.v/DATA.tv;o._pm=x.v?(x.m||0)/x.v:0;if(cum){a+=x.v;o._ac=a/DATA.tv}return o})}
const ROWS={mapa:prep(DATA.todas),top:prep(DATA.top,true),resto:prep(DATA.resto)};
const ST={mapa:{s:null,d:1,q:'',f:null},top:{s:null,d:1,q:'',f:null},resto:{s:null,d:1,q:'',f:null}};
function fmt(v,t){switch(t){case 'n':return nf(v);case 'm':return mf(v);case 'm2':return m2(v);
  case 'd':return d1(v);case 'pc':return v?pc(v):'–';case 'pc2':return v?(v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'–';
  case 'p':return pill(v);case 'r':return v;default:return v||'—'}}
function tabela(id,titulo,filtros){
  const cols=COLS[id],st=ST[id];
  let rs=ROWS[id].filter(x=>(!st.q||x.c.toLowerCase().includes(st.q))&&(!st.f||x.s===st.f));
  if(st.s){const k=st.s;rs=[...rs].sort((a,b)=>{const A=a[k],B=b[k];
    return (typeof A==='string'?A.localeCompare(B,'pt-BR'):A-B)*st.d})}
  const th=cols.map(c=>`<th class="${['t','p','r'].includes(c.t)?'l':''} ${st.s===c.k?'sorted':''}" data-k="${c.k}">${c.h}<span class="ar">${st.s===c.k?(st.d>0?'▲':'▼'):'⇅'}</span></th>`).join('');
  const body=rs.length?rs.map(x=>'<tr>'+cols.map(c=>{
    const cls=c.k==='c'?'l city':c.k==='_i'?'l rank':['k','r'].includes(c.k)?'l dim':c.t==='p'?'l':c.k==='v'?'num':'';
    return `<td class="${cls}">${fmt(x[c.k],c.t)}</td>`}).join('')+'</tr>').join(''):'';
  const tv=rs.reduce((s,x)=>s+x.v,0),te=rs.reduce((s,x)=>s+x.e,0),tp=rs.reduce((s,x)=>s+x.p,0),tm=rs.reduce((s,x)=>s+(x.m||0),0);
  const foot=cols.map(c=>{if(c.k==='c')return `<td class="l">Total · ${rs.length} cidades</td>`;
    if(c.k==='p')return `<td>${nf(tp)}</td>`;if(c.k==='v')return `<td>${nf(tv)}</td>`;
    if(c.k==='e')return `<td>${mf(te)}</td>`;if(c.k==='m')return `<td>${nf(tm)}</td>`;
    if(c.k==='_tk')return `<td>${m2(tk(te,tv))}</td>`;if(c.k==='_pr')return `<td>${d1(per(tv,tp))}</td>`;
    if(c.k==='_ps')return `<td>${pc(tv/DATA.tv)}</td>`;return '<td></td>'}).join('');
  const chips=filtros?`<button class="chip ${!st.f?'on':''}" data-f="">Todas</button>
    <button class="chip ${st.f==='MANTÉM'?'on':''}" data-f="MANTÉM">Fica</button>
    <button class="chip ${st.f==='SAI'?'on':''}" data-f="SAI">Sai</button>
    <button class="chip ${st.f==='ENTRA'?'on':''}" data-f="ENTRA">Entra</button>`:'';
  return `<div class="tbl-wrap"><div class="tbl-top">
      <div class="tbl-title">${titulo}<span>${rs.length} de ${ROWS[id].length}</span></div>
      <div class="tools">${chips}<input class="search" placeholder="Buscar cidade…" value="${st.q}"></div></div>
    <div class="scroll"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>
      ${rs.length?`<tfoot><tr>${foot}</tr></tfoot>`:''}</table>
      ${rs.length?'':'<div class="empty">Nenhuma cidade encontrada.</div>'}</div></div>`;
}
const NOTAS={
 mapa:`<div class="notes"><h4>Legenda da coluna Meta</h4><ul>
   <li><b>Fica</b> — está no targeting do Meta hoje e permanece · <b>100 cidades</b>.</li>
   <li><b>Sai</b> — está no Meta e será removida · <b>27 cidades</b>, que somam apenas 332 vendas no ano.</li>
   <li><b>Entra</b> — nova, será inserida · <b>16 cidades</b>, com 1.939 vendas já acontecendo sem mídia.</li>
   <li>"Vendas via Meta" é um recorte <b>dentro</b> do total, por last-click facebook/cpc no GA4 — captura as duas contas Meta de Minas Cap.</li></ul></div>`,
 top:`<div class="notes"><h4>Observações</h4><ul>
   <li><b>Belo Horizonte sozinha</b> responde por 54,2% das vendas — mais que as outras 115 cidades somadas.</li>
   <li>Onze das doze são da Região Metropolitana de BH. A única exceção é <b>Sete Lagoas</b>, em 7º lugar.</li>
   <li>O 13º colocado é <b>Pedro Leopoldo</b>, com 5.767 vendas — a 339 de distância de Sabará.</li></ul></div>`,
 resto:`<div class="notes"><h4>A cauda</h4><ul>
   <li>104 cidades, <b>1,77 milhão de habitantes</b> e 10,5% das vendas.</li>
   <li>Penetração de 28,9 vendas por mil habitantes contra 87,9 do Top 12 — <b>três vezes menor</b>.</li>
   <li>É aqui que estão as 16 cidades novas e o eixo de Ponte Nova, sem histórico de mídia.</li></ul></div>`
};
function render(){
  document.getElementById('p-resumo').innerHTML=resumo();
  document.getElementById('p-mapa').innerHTML=tabela('mapa','Mapeamento completo',true)+NOTAS.mapa;
  document.getElementById('p-top').innerHTML=tabela('top','Top 12 cidades',false)+NOTAS.top;
  document.getElementById('p-resto').innerHTML=tabela('resto','Fora do Top 12',false)+NOTAS.resto;
}
render();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById('p-'+b.dataset.p).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
});
const idOf=el=>{const p=el.closest('.panel').id.replace('p-','');return p==='mapa'?'mapa':p};
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-k]');
  if(th){const id=idOf(th),k=th.dataset.k,s=ST[id];
    if(s.s===k)s.d=-s.d;else{s.s=k;s.d=k==='c'?1:-1}render();return}
  const ch=e.target.closest('.chip');
  if(ch){const id=idOf(ch);ST[id].f=ch.dataset.f||null;render()}
});
document.addEventListener('input',e=>{
  if(!e.target.classList.contains('search'))return;
  const id=idOf(e.target),v=e.target.value;ST[id].q=v.toLowerCase();render();
  const inp=document.querySelector('#p-'+(id==='mapa'?'mapa':id)+' .search');
  if(inp){inp.focus();inp.setSelectionRange(v.length,v.length)}
});
</script>
