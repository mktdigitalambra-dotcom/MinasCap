<style>
  :root{
    --bg: #0A0E14;
    --bg-elevated: #10151D;
    --card: #141A24;
    --border: #212936;
    --text: #F2F1ED;
    --text-dim: #8B94A3;
    --text-faint: #5A6472;
    --azul: #3E7BD6;
    --azul-soft: rgba(62,123,214,0.14);
    --bordo: #D9607C;
    --bordo-soft: rgba(217,96,124,0.14);
    --verde: #63C58E;
    --verde-soft: rgba(99,197,142,0.14);
    --track: #1C232E;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .shell{ max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap: wrap; gap: 6px;
    margin-bottom: 20px;
  }
  header.page-head h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  header.page-head h1 span{ color: var(--text-dim); font-weight: 500; }
  header.page-head .tagline{ color: var(--text-faint); font-size: 12px; }

  /* Month nav */
  nav.month-nav{
    display:flex; gap:4px; flex-wrap:wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  nav.month-nav button{
    font-family:'IBM Plex Sans', sans-serif;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid transparent;
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  nav.month-nav button:hover{ background: var(--bg-elevated); color: var(--text); }
  nav.month-nav button.active{
    background: var(--azul-soft);
    color: #9EC1F0;
    border-color: rgba(62,123,214,0.35);
  }
  nav.month-nav button:disabled{
    color: var(--text-faint);
    cursor: default;
    opacity: .45;
  }
  nav.month-nav button:disabled:hover{ background: transparent; }

  /* Edition nav */
  nav.edition-nav{
    display:flex; gap:5px; flex-wrap:wrap;
    margin-bottom: 18px;
  }
  nav.edition-nav button{
    font-family:'Space Grotesk', sans-serif;
    background: var(--card);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  nav.edition-nav button:hover{ color: var(--text); }
  nav.edition-nav button.active{
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  nav.edition-nav button.summary-btn{
    border-style: dashed;
    color: #EFA5B4;
    border-color: rgba(217,96,124,0.4);
  }
  nav.edition-nav button.summary-btn.active{
    background: var(--bordo);
    color: #1A0C10;
    border-color: var(--bordo);
    border-style: solid;
  }

  /* Stat cards */
  .stats-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .stat-card{
    background: var(--card);
    padding: 14px 16px;
  }
  .stat-card .label{ font-size: 11.5px; color: var(--text-dim); margin-bottom: 7px; }
  .stat-card .value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .stat-card .sub{ font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .stat-card.leader .value{ font-size: 17px; }

  /* Legend */
  .legend{
    display:flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .pill{
    display:inline-flex; align-items:center; gap: 6px;
    padding: 4px 10px 4px 5px;
    border-radius: 999px;
    font-size: 11.5px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .pill .dot-label{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .pill.azul .dot-label{ background: var(--azul-soft); color: #9EC1F0; }
  .pill.bordo .dot-label{ background: var(--bordo-soft); color: #EFA5B4; }
  .pill.verde .dot-label{ background: var(--verde-soft); color: #A6E0C1; }
  .pill .desc{ color: var(--text-dim); }

  /* Table */
  .table-wrap{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-title{
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--text-faint);
    padding: 12px 16px 9px;
    border-bottom: 1px solid var(--border);
  }
  table{ width: 100%; border-collapse: collapse; }
  thead th{
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-faint);
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
  }
  thead th.num, tbody td.num{ text-align: center; }
  tbody td{
    padding: 9px 16px;
    font-size: 12.5px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody td.rank{ color: var(--text-faint); width: 28px; }
  tbody td.city{ font-weight: 600; font-size: 13px; }
  .badge-rank{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-size: 9.5px; font-weight: 600;
    width: 17px; height: 17px; border-radius: 999px;
    margin-left: 6px;
    background: var(--azul-soft); color: #9EC1F0;
  }
  .chip{
    display:inline-flex; align-items:center; justify-content:center;
    min-width: 22px; height: 19px; padding: 0 5px;
    border-radius: 999px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px; font-weight: 600;
  }
  .chip.azul{ background: var(--azul-soft); color: #9EC1F0; }
  .chip.bordo{ background: var(--bordo-soft); color: #EFA5B4; }
  .chip.verde{ background: var(--verde-soft); color: #A6E0C1; }
  .chip.dash{ color: var(--text-faint); background: transparent; }
  td.total-col{ font-weight: 600; color: var(--azul); text-align: center; }
  .participation{ display:flex; align-items:center; gap: 8px; min-width: 100px; }
  .bar-track{ flex:1; height: 5px; background: var(--track); border-radius: 999px; overflow:hidden; }
  .bar-fill{ height: 100%; background: linear-gradient(90deg, #3E7BD6, #6FA3E8); border-radius: 999px; }
  .pct{ font-size: 11px; color: var(--text-dim); width: 30px; text-align:right; }

  .footnote{
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-faint);
  }

  .empty-state{
    padding: 60px 20px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  .cover-section-title{
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    margin: 0 0 10px;
  }

  /* Sales channel section */
  .channel-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    margin: 0;
  }
  .channel-card{
    background: var(--card);
    padding: 14px 16px;
    text-align: center;
  }
  .channel-label{ font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; }
  .channel-value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
  }
  .channel-pct{ font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .top-revendedores{
    padding: 4px 16px 14px;
  }
  .data-pending-note{
    font-size: 11.5px;
    color: var(--text-faint);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 16px;
  }
  .tr-title{
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .tr-row{
    display:flex; align-items:center; gap: 8px;
    padding: 5px 0;
    font-size: 12.5px;
  }
  .tr-rank{ color: var(--text-faint); width: 20px; font-size: 11px; }
  .tr-name{ flex:1; color: var(--text); }
  .tr-count{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    color: var(--azul);
    font-size: 12.5px;
  }

  /* Back row */
  .year-summary-btn{
    border-style: dashed !important;
    color: #9EC1F0 !important;
    border-color: rgba(62,123,214,0.4) !important;
    margin-right: 4px;
  }
  .year-summary-btn.active{
    background: var(--azul) !important;
    color: #08111F !important;
    border-color: var(--azul) !important;
    border-style: solid !important;
  }

  @media (max-width: 640px){
    .stats-row{ grid-template-columns: 1fr; }
    thead th, tbody td{ padding: 10px 12px; font-size: 13px; }
    .participation{ min-width: 90px; }
  }
</style>

/* ============================================================
   RENDER LOGIC
   ============================================================ */
const SUMMARY_KEY = "__summary__";
let currentView = "cover"; // "cover" | "month"
let activeMonth = REPORT_DATA.months[0] ? REPORT_DATA.months[0].key : null;
let activeEdition = REPORT_DATA.months[0] ? REPORT_DATA.months[0].editions[0].key : null;

function combineEditions(editions){
  const combined = { prizes: [], bateuNaTrave: [], giraMinas: [], hasBateuTrave: editions.some(e => e.hasBateuTrave) };
  editions.forEach(ed => {
    combined.prizes.push(...ed.prizes);
    combined.bateuNaTrave.push(...ed.bateuNaTrave);
    combined.giraMinas.push(...ed.giraMinas);
  });
  return combined;
}

function classifyVendor(v){
  if(!v) return 'Não informado';
  const upper = v.toUpperCase();
  if(upper.includes('VENDAS ONLINE') || upper.includes('VENDA ONLINE') || upper.includes('VENDAS ON LINE') || upper.includes('VENDA ON LINE') || upper.includes('TITULO DIGITAL') || upper.includes('TÍTULO DIGITAL') || upper.includes('LOJA VIRTUAL') || upper.includes('LOJA VIRT') || upper === 'ONLINE') return 'Venda Online';
  if(upper.includes('MAQUININHA') || upper.includes(' - POS') || upper.endsWith('POS')) return 'Maquininha POS';
  return 'Revendedor';
}

function buildChannelStats(edition){
  const all = [];
  edition.prizes.forEach(p => p.winners.forEach(w => all.push(w)));
  edition.giraMinas.forEach(w => all.push(w));
  const counts = { 'Venda Online': 0, 'Maquininha POS': 0, 'Revendedor': 0, 'Não informado': 0 };
  const revendedorCounts = {};
  all.forEach(w => {
    const cat = classifyVendor(w.vendor);
    counts[cat] = (counts[cat] || 0) + 1;
    if(cat === 'Revendedor' && w.vendor){
      revendedorCounts[w.vendor] = (revendedorCounts[w.vendor] || 0) + 1;
    }
  });
  const allRevendedoresSorted = Object.entries(revendedorCounts)
    .sort((a,b) => b[1] - a[1])
    .map(([name, count]) => ({ name, count }));
  const topRevendedores = allRevendedoresSorted.slice(0, 10);
  const uniqueRevendedores = Object.keys(revendedorCounts).length;
  const hasVendorData = counts['Não informado'] < all.length;
  return { counts, topRevendedores, allRevendedoresSorted, total: all.length, uniqueRevendedores, hasVendorData };
}

function buildCityRanking(edition){
  const cities = {};
  const bump = (city, field) => {
    if(!cities[city]) cities[city] = { premios:0, bateu:0, gira:0 };
    cities[city][field]++;
  };
  edition.prizes.forEach(p => p.winners.forEach(w => bump(w.city, 'premios')));
  edition.bateuNaTrave.forEach(w => bump(w.city, 'bateu'));
  edition.giraMinas.forEach(w => bump(w.city, 'gira'));

  const rows = Object.entries(cities).map(([city, c]) => ({
    city,
    premios: c.premios,
    bateu: c.bateu,
    gira: c.gira,
    total: c.premios + c.bateu + c.gira
  }));
  rows.sort((a,b) => b.total - a.total);
  return rows;
}

function renderMonthNav(){
  const nav = document.getElementById('monthNav');
  nav.innerHTML = '';

  const summaryBtn = document.createElement('button');
  summaryBtn.textContent = 'Resumo Anual';
  summaryBtn.classList.add('year-summary-btn');
  if(currentView === 'cover') summaryBtn.classList.add('active');
  summaryBtn.onclick = () => { currentView = 'cover'; render(); };
  nav.appendChild(summaryBtn);

  const monthOrder = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  monthOrder.forEach(label => {
    const found = REPORT_DATA.months.find(m => m.label === label);
    const btn = document.createElement('button');
    btn.textContent = label;
    if(!found){ btn.disabled = true; }
    else{
      if(currentView === 'month' && found.key === activeMonth) btn.classList.add('active');
      btn.onclick = () => { currentView = 'month'; activeMonth = found.key; activeEdition = found.editions[0].key; render(); };
    }
    nav.appendChild(btn);
  });
}

function renderEditionNav(month){
  const nav = document.getElementById('editionNav');
  nav.innerHTML = '';
  month.editions.forEach(ed => {
    const btn = document.createElement('button');
    btn.textContent = ed.label;
    if(ed.key === activeEdition) btn.classList.add('active');
    btn.onclick = () => { activeEdition = ed.key; render(); };
    nav.appendChild(btn);
  });
  const summaryBtn = document.createElement('button');
  summaryBtn.textContent = 'Resumo do mês';
  summaryBtn.classList.add('summary-btn');
  if(activeEdition === SUMMARY_KEY) summaryBtn.classList.add('active');
  summaryBtn.onclick = () => { activeEdition = SUMMARY_KEY; render(); };
  nav.appendChild(summaryBtn);
}

function render(){
  renderMonthNav();
  document.getElementById('editionNav').style.display = currentView === 'month' ? 'flex' : 'none';

  if(currentView === 'cover'){
    renderCover();
    return;
  }
  const month = REPORT_DATA.months.find(m => m.key === activeMonth);
  renderEditionNav(month);
  if(activeEdition === SUMMARY_KEY){
    renderMonthSummaryContent(month);
  } else {
    const edition = month.editions.find(e => e.key === activeEdition);
    renderContent(edition);
  }
}

document.getElementById('lastUpdate').textContent = (() => {
  if(!REPORT_DATA.months.length) return '—';
  const last = REPORT_DATA.months[REPORT_DATA.months.length - 1];
  const ed = last.editions[last.editions.length - 1];
  return ed.label + '/' + last.label.slice(0,3);
})();

render();
